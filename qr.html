<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código QR - Desafío de Señales Viales</title>
  <meta name="description" content="Escanea el código QR para ingresar a la actividad de Cierre de Jornada.">

  <!-- Tipografía Archivo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <style>
    .qr-page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .qr-display-card {
      background: var(--color-primary-surface);
      border: 2px solid var(--color-accent);
      border-radius: var(--radius-lg);
      padding: 2.75rem 2.25rem;
      max-width: 600px;
      width: 100%;
      box-shadow: var(--shadow-glow-turquoise), 0 10px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      animation: scaleIn 0.4s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-header-logos {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .qr-ba-logo {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .qr-event-tag {
      background: var(--color-accent-soft);
      border: 1px solid var(--color-accent);
      color: var(--color-accent);
      padding: 0.35rem 1rem;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .qr-main-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--color-white);
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .qr-main-sub {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-accent);
      margin-bottom: 2rem;
      max-width: 460px;
    }

    .qr-frame {
      background: #FFFFFF;
      padding: 1.25rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glow-yellow), 0 8px 30px rgba(0,0,0,0.35);
      border: 4px solid var(--color-secondary);
      display: inline-block;
      margin-bottom: 1.75rem;
      transition: transform 0.3s ease;
    }

    .qr-frame:hover {
      transform: scale(1.02);
    }

    .qr-frame img {
      width: 280px;
      height: 280px;
      display: block;
      image-rendering: pixelated;
    }

    .qr-instruction-step {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.05rem;
      color: var(--color-white);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .qr-url-pill {
      background: rgba(13, 34, 47, 0.85);
      border: 1.5px solid var(--color-accent);
      color: var(--color-secondary);
      font-family: monospace;
      font-size: 1.05rem;
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-full);
      font-weight: 700;
      word-break: break-all;
      margin-bottom: 1.75rem;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
    }

    .qr-url-pill:hover {
      background: var(--color-secondary);
      color: var(--color-primary);
      box-shadow: var(--shadow-glow-yellow);
    }

    .qr-buttons-row {
      display: flex;
      gap: 0.85rem;
      width: 100%;
      flex-wrap: wrap;
    }

    .qr-action-btn {
      flex: 1;
      min-width: 170px;
      padding: 0.85rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .qr-btn-primary {
      background: var(--color-secondary);
      color: var(--color-primary);
      border: none;
    }

    .qr-btn-primary:hover {
      background: #ffd22e;
      box-shadow: var(--shadow-glow-yellow);
    }

    .qr-btn-outline {
      background: transparent;
      color: var(--color-accent);
      border: 1.5px solid var(--color-accent);
    }

    .qr-btn-outline:hover {
      background: var(--color-accent);
      color: var(--color-primary);
      box-shadow: var(--shadow-glow-turquoise);
    }

    @media (max-width: 600px) {
      .qr-frame img {
        width: 220px;
        height: 220px;
      }
      .qr-main-title {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <main class="qr-page-container">
    <div class="qr-display-card">
      
      <!-- Logo BA -->
      <div class="qr-header-logos">
        <img src="assets/img/logo_ba_blanco.png" alt="Buenos Aires Ciudad" class="qr-ba-logo">
      </div>

      <span class="qr-event-tag">Educación Vial Escolar</span>
      <h1 class="qr-main-title">Desafío de Señales Viales</h1>
      <p class="qr-main-sub">Escaneá el código QR con la cámara de tu celular para ingresar al juego</p>

      <!-- Código QR Gigante -->
      <div class="qr-frame">
        <img src="assets/img/qr_evento.png" alt="Código QR para ingresar al evento" id="qr-img">
      </div>

      <div class="qr-instruction-step">
        <span>📸</span>
        <span>Apuntá la cámara de tu celular al código</span>
      </div>

      <a href="https://amalarajst-cell.github.io/bried-cierre/" class="qr-url-pill" target="_blank" title="Abrir enlace directo">
        https://amalarajst-cell.github.io/bried-cierre/
      </a>

      <!-- Botones de Acción -->
      <div class="qr-buttons-row">
        <a href="imprimir_qr.html" class="qr-action-btn qr-btn-primary">
          🖨️ Versión Imprimible (A4 / Fondo Blanco)
        </a>

        <a href="assets/img/afiche_qr_imprimir.png" download="afiche_qr_imprimir.png" class="qr-action-btn qr-btn-outline">
          📥 Descargar Imagen PNG
        </a>

        <button type="button" onclick="toggleFullscreen()" class="qr-action-btn qr-btn-outline" id="btn-fs">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          Pantalla Completa
        </button>

        <a href="admin.html" class="qr-action-btn qr-btn-outline">
          Panel de Admin ↗
        </a>
      </div>

    </div>
  </main>

  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.getElementById('btn-fs').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14h6m-6 0v6m16-6h-6m6 0v6M4 10h6m-6 0V4m16 6h-6m6 0V4"/></svg> Salir Pantalla Completa';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
        document.getElementById('btn-fs').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg> Pantalla Completa';
      }
    }
  </script>
</body>
</html>
